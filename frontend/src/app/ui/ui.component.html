<div class="container mt-4">

  <h2 class="mb-4">Employee Manager</h2>

  <!-- FILTERS -->
  <div class="row mb-3">

    <div class="col-md-4">
      <input
        type="text"
        class="form-control"
        placeholder="Search by name or email"
        [(ngModel)]="keyword"
        (input)="search()">
    </div>

    <div class="col-md-3">
      <select
        class="form-select"
        [(ngModel)]="selectedJobTitle"
        (change)="search()">

        <option value="">All Job Titles</option>

        <option
          *ngFor="let title of jobTitles"
          [value]="title">

          {{ title }}

        </option>

      </select>
    </div>

    <div class="col-md-2">
      <button
        class="btn btn-secondary w-100"
        (click)="clearFilters()">

        Clear

      </button>
    </div>

  </div>

  <!-- TABLE -->
  <table class="table table-bordered table-hover">

    <thead class="table-dark">

      <tr>

        <th (click)="sort('id')">
          ID
        </th>

        <th (click)="sort('name')">
          Name
        </th>

        <th (click)="sort('email')">
          Email
        </th>

        <th (click)="sort('phone')">
          Phone
        </th>

        <th (click)="sort('jobTitle')">
          Job Title
        </th>

      </tr>

    </thead>

    <tbody>

      <tr *ngFor="let employee of employees">

        <td>{{ employee.id }}</td>
        <td>{{ employee.name }}</td>
        <td>{{ employee.email }}</td>
        <td>{{ employee.phone }}</td>
        <td>{{ employee.jobTitle }}</td>

      </tr>

    </tbody>

  </table>

  <!-- LOADING -->
  <div *ngIf="!isLoaded" class="text-center mt-3">
    Loading...
  </div>

  <!-- EMPTY -->
  <div
    *ngIf="isLoaded && employees.length === 0"
    class="alert alert-info">

    No employees found.

  </div>

  <!-- PAGINATION -->
  <div class="d-flex justify-content-center gap-2 mt-3">

    <button
      class="btn btn-outline-primary"
      (click)="changePage(currentPage - 1)">

      Previous

    </button>

    <span class="align-self-center">

      Page {{ currentPage + 1 }}
      of
      {{ totalPages }}

    </span>

    <button
      class="btn btn-outline-primary"
      (click)="changePage(currentPage + 1)">

      Next

    </button>

  </div>

</div>
